<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        text-align: center;
        background-color: #000; /* Optional background color */
      }
      #unity-container {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }
      #unity-canvas {
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const desiredAspectRatio = 600 / 960; // Define the aspect ratio (width / height)

      // Function to check if OffscreenCanvas WebGL support is available
      function isOffscreenCanvasWebGLSupported() {
        if (typeof OffscreenCanvas === 'undefined') {
          return false; // OffscreenCanvas is not supported
        }
        try {
          const offscreenCanvas = new OffscreenCanvas(1, 1);
          const gl = offscreenCanvas.getContext("webgl") || offscreenCanvas.getContext("webgl2");
          return !!gl; // WebGL context is available
        } catch (e) {
          return false; // Error or unsupported
        }
      }

      if (!isOffscreenCanvasWebGLSupported()) {
        console.warn("OffscreenCanvas with WebGL is not fully supported in this browser. Adjusting fallback settings.");
        // Optionally, add fallback logic here if needed
      }

      function resizeCanvas() {
        const containerWidth = window.innerWidth;
        const containerHeight = window.innerHeight;
        const containerAspectRatio = containerWidth / containerHeight;

        if (containerAspectRatio > desiredAspectRatio) {
          // Wider than desired aspect ratio, limit by height
          const height = containerHeight;
          const width = height * desiredAspectRatio;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
        } else {
          // Taller than desired aspect ratio, limit by width
          const width = containerWidth;
          const height = width / desiredAspectRatio;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
        }
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas(); // Initial resize

      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        #if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
        #endif
        #if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        #endif
        #if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
        #endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Uncomment these if needed:
        // matchWebGLToCanvasSize: false,
        // devicePixelRatio: 1,
      });
    </script>
  </body>
</html>
